<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVGFC × BAC Malaysia | International Program Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#1B5E20;--g2:#2E7D32;--g3:#66BB6A;--mint:#E8F5E9;--gold:#F9A825;--ink:#1d2b1f;--muted:#5f6f62;--card:#fff;--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(1200px 600px at 10% -10%,#c8e6c9 0,transparent 60%),radial-gradient(900px 500px at 100% 110%,#fff3c4 0,transparent 55%),#f4faf4;
  overflow-x:hidden}
.cloud{position:fixed;font-size:64px;opacity:.12;animation:drift 40s linear infinite;pointer-events:none;z-index:0}
.cloud:nth-child(1){top:12%;left:-10%}
.cloud:nth-child(2){top:55%;left:-20%;animation-duration:55s;font-size:90px}
.cloud:nth-child(3){top:80%;left:-15%;animation-duration:48s}
@keyframes drift{to{transform:translateX(130vw)}}

header{position:relative;z-index:2;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 18px rgba(27,94,32,.35)}
.brand{display:flex;align-items:center;gap:12px}
.logo-slot{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.15);border:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;font-size:9px;font-weight:700;text-align:center;line-height:1.1;overflow:hidden}
.logo-slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand h1{font-size:14px;font-weight:700;line-height:1.2}
.brand small{font-weight:400;opacity:.85;font-size:11px}

.track{position:relative;z-index:2;max-width:760px;margin:22px auto 0;padding:0 20px}
.track-line{position:relative;height:10px;background:#d7e8d8;border-radius:99px}
.track-fill{height:100%;width:0;background:linear-gradient(90deg,var(--g3),var(--gold));border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.plane{position:absolute;top:-16px;left:0;font-size:26px;transition:left .6s cubic-bezier(.2,.9,.3,1);transform:translateX(-50%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.track-labels{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);margin-top:8px}

main{position:relative;z-index:2;max-width:760px;margin:18px auto 40px;padding:0 20px}
.stage{background:var(--card);border-radius:var(--r);padding:30px 28px;box-shadow:0 18px 50px rgba(27,94,32,.14);border:1px solid #e2efe2}
.stage.fwd{animation:inR .45s cubic-bezier(.2,.9,.3,1)}
.stage.back{animation:inL .45s cubic-bezier(.2,.9,.3,1)}
@keyframes inR{from{opacity:0;transform:translateX(40px)}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}}
.chip{display:inline-block;background:var(--mint);color:var(--g1);font-weight:700;font-size:12px;padding:5px 12px;border-radius:99px;margin-bottom:14px}
h2{font-size:clamp(20px,4vw,26px);line-height:1.3;font-weight:700;margin-bottom:8px}
p.lead{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:18px}
.big{font-size:72px;text-align:center;margin:6px 0;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.center{text-align:center}
.privacy{list-style:none;display:grid;gap:10px;margin:14px 0 18px}
.privacy li{background:#f6fbf6;border-left:4px solid var(--g2);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.55}
.privacy b{color:var(--g1)}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--mint);padding:14px;border-radius:14px;cursor:pointer;font-size:13px;line-height:1.5}
.check input{width:20px;height:20px;accent-color:var(--g2);flex:none;margin-top:2px}

.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:14px;font-weight:500;background:#fff;border:2px solid #dcebdc;border-radius:16px;padding:14px;cursor:pointer;transition:.18s;position:relative}
.opt:hover{border-color:var(--g3);transform:translateY(-2px);box-shadow:0 8px 18px rgba(46,125,50,.15)}
.opt .em{font-size:24px;flex:none}
.opt kbd{position:absolute;right:10px;top:8px;font-size:10px;color:#9bb09d;font-family:inherit;font-weight:600}
.opt.sel{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;border-color:var(--g1);animation:pop .35s}
.opt.sel kbd{color:#cfe8d1}
@keyframes pop{40%{transform:scale(1.04)}}
.opt.wide{grid-column:1/-1}
.spec{width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;border:2px solid var(--g3);font:inherit;font-size:14px;outline:none;animation:inR .3s}
.spec:focus{box-shadow:0 0 0 4px rgba(102,187,106,.25)}
.cheer{min-height:22px;text-align:center;margin-top:14px;font-size:13px;font-weight:600;color:var(--g2)}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.btn{font:inherit;font-weight:700;font-size:14px;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;transition:.2s}
.btn.primary{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;box-shadow:0 8px 18px rgba(27,94,32,.3)}
.btn.primary:hover:not(:disabled){transform:translateY(-2px)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#eef5ee;color:var(--g1)}
.btn.gold{background:var(--gold);color:#3b2a00}
footer{position:relative;z-index:2;text-align:center;font-size:11px;color:var(--muted);padding:0 20px 24px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
@media(max-width:560px){.options{grid-template-columns:1fr}.stage{padding:24px 18px}.brand h1{font-size:12px}}
</style>
</head>
<body>
<div class="cloud">☁️</div><div class="cloud">☁️</div><div class="cloud">☁️</div>

<header>
  <div class="brand">
    <div class="logo-slot"><img src="assets/mvgfclogo.png" alt="MVGFC" onerror="this.replaceWith('MVGFC LOGO')"></div>
    <div><h1>Manuel V. Gallego Foundation Colleges, Inc.<br><small>[Office / Tagline placeholder]</small></h1></div>
  </div>
  <div class="logo-slot"><img src="assets/bace-white.png" alt="BAC" onerror="this.replaceWith('BAC LOGO')"></div>
</header>

<div class="track">
  <div class="track-line"><div class="track-fill" id="fill"></div><div class="plane" id="plane">✈️</div></div>
  <div class="track-labels"><span>🇵🇭 Manila</span><span id="count"></span><span>Kuala Lumpur 🇲🇾</span></div>
</div>

<main><section class="stage" id="stage"></section></main>
<footer>© MVGFC · [Your office name placeholder] · Data Privacy Act of 2012 (RA 10173)</footer>
<canvas id="confetti"></canvas>

<script>
/* ========= CONFIG ========= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwulvjzaYkyRSfVjeta2h5LZxP3ykjMcEkfsk7H5GzSdH-sc7bpYP5Kzg5hVCrT8py-5Q/exec';

/* ========= DATA ========= */
const parts=[
 {id:1,tag:'Boarding Pass',emoji:'🎫',title:'Professional Profile',blurb:'Let’s check you in! A few quick details about you.'},
 {id:2,tag:'Takeoff',emoji:'🛫',title:'Interest in International Education',blurb:'How do you feel about studying with a global flair?'},
 {id:3,tag:'Flight Path',emoji:'🧭',title:'Program & Study Preferences',blurb:'Choose your route: program, field, and how you like to learn.'},
 {id:4,tag:'Fare Check',emoji:'💳',title:'Affordability & Financial Considerations',blurb:'Let’s find a ticket price that feels right.'},
 {id:5,tag:'Landing',emoji:'🛬',title:'Enrollment Intention & Market Acceptance',blurb:'Final approach! Just two more questions.'}
];
// option: [emoji, label, needsSpecify?]
const Q=[
 {p:1,t:'Current or most recent educational level',o:[['🎓','Bachelor Degree'],['📘','Master’s Degree'],['📗','Master’s Degree with earned units',1],['🏛️','Doctorate Degree'],['📙','Doctoral Degree with earned units',1],['✏️','Others',1]],h:'Master’s with Earned Units'},
 {p:1,t:'Current employment status',o:[['💼','Employed Full-time'],['🕒','Employed Part-time'],['🚀','Self-employed'],['🔎','Unemployed'],['✏️','Others',1]],h:'Employment Status'},
 {p:1,t:'Type of institution where you are employed',o:[['🏛️','Government Institution'],['🏢','Private Institution'],['✏️','Others',1]],h:'Institution Type'},
 {p:1,t:'In which region of the Philippines do you currently reside?',o:[['🏙️','National Capital Region (NCR)'],['⛰️','Cordillera Administrative Region (CAR)'],['🌾','Region I – Ilocos Region'],['🌽','Region II – Cagayan Valley'],['🌻','Region III – Central Luzon'],['🌋','Region IV-A – CALABARZON'],['🏝️','MIMAROPA Region'],['🌶️','Region V – Bicol Region'],['🎭','Region VI – Western Visayas'],['🏖️','Region VII – Central Visayas'],['🌊','Region VIII – Eastern Visayas'],['🌴','Region IX – Zamboanga Peninsula'],['🍍','Region X – Northern Mindanao'],['🦅','Region XI – Davao Region'],['🥭','Region XII – SOCCSKSARGEN'],['🌅','Region XIII – Caraga'],['🕌','BARMM'],['🌏','Outside the Philippines']],h:'Region'},
 {p:1,t:'Current monthly income range',o:[['🌱','Below ₱20,000'],['🌿','₱20,000–₱39,999'],['🌳','₱40,000–₱59,999'],['🏔️','₱60,000–₱99,999'],['⭐','₱100,000 and above']],h:'Monthly Income'},
 {p:2,t:'Prior to this survey, have you considered pursuing an academic program with an international institution?',o:[['👍','Yes'],['🙅','No'],['🤔','Not yet, but I may consider it']],h:'Considered International Program'},
 {p:2,t:'How interested are you in enrolling in an academic program that provides exposure to an international institution such as Brickfields Asia College, Malaysia?',o:[['🤩','Interested'],['🤷','Not Sure / Undecided'],['😐','Not Interested']],h:'Interest in BAC'},
 {p:2,t:'What would be your primary reason for considering an international academic program?',o:[['🌐','Internationally oriented education'],['📈','Better career opportunities'],['✈️','Opportunity to study or gain exposure abroad'],['📜','International academic credentials'],['🧠','Development of global skills and competencies'],['🧳','Preparation for employment abroad'],['🌟','Personal and professional development'],['✏️','Other',1]],h:'Primary Reason'},
 {p:2,t:'Which factor would MOST influence your decision to enroll in an international academic program?',o:[['💰','Tuition and other fees'],['🏫','Reputation of the partner institution'],['📚','Program or course offered'],['🏅','International recognition of the qualification'],['🕰️','Flexible learning arrangement'],['💼','Employment and career opportunities'],['🗺️','Opportunity for overseas study or exposure'],['🎁','Scholarship or financial assistance'],['✏️','Other',1]],h:'Most Influential Factor'},
 {p:3,t:'What type of international academic program would you be most interested in?',o:[['📄','Diploma Program'],['🎓','Undergraduate / Bachelor’s Degree Program'],['🏆','Postgraduate / Master’s Degree Program']],h:'Program Type'},
 {p:3,t:'Which field of study would you most likely consider?',o:[['📊','Business and Management'],['🧮','Accounting and Finance'],['💻','Information Technology / Computing'],['⚖️','Law and Legal Studies'],['🎬','Communication / Media'],['🏨','Hospitality and Tourism'],['🍎','Education'],['✏️','Other',1]],h:'Field of Study'},
 {p:3,t:'If part of the program required study or academic exposure in Malaysia, would you be willing to participate?',o:[['🇲🇾','Yes'],['🤔','Maybe'],['🏠','No']],h:'Willing to Go to Malaysia'},
 {p:3,t:'What learning modality would be most convenient for you?',o:[['🏫','Face-to-Face'],['💻','Fully Online'],['🔀','Hybrid / Blended'],['📅','Weekend Classes'],['🌙','Evening Classes']],h:'Learning Modality'},
 {p:3,t:'Preferred payment arrangement',o:[['💵','Full Payment'],['🗓️','Monthly Installment'],['✏️','Others',1]],h:'Payment Arrangement'},
 {p:4,t:'What annual tuition and academic fee range would you consider affordable for an international academic program?',o:[['🪙','Below ₱90,000'],['💴','₱90,000–₱119,999'],['💶','₱120,000–₱149,999'],['💷','₱150,000–₱179,999'],['💎','₱180,000 and above'],['🧐','Cannot determine without seeing the program details']],h:'Affordable Annual Tuition'},
 {p:4,t:'Which financial assistance option would most encourage you to enroll?',o:[['🎖️','Scholarship'],['🗓️','Installment Payment Scheme'],['🏷️','Tuition Discount'],['🏦','Financing Arrangement'],['✏️','Other',1]],h:'Preferred Financial Assistance'},
 {p:5,t:'If an international academic program in collaboration with BAC Malaysia were made available through MVGFC at a reasonable cost, how likely would you be to enroll?',o:[['🚀','Very Likely'],['🤔','Undecided'],['🛑','Very Unlikely']],h:'Likelihood to Enroll'},
 {p:5,t:'Would you recommend the proposed international academic program to a family member, friend, or colleague who may be interested in international education?',o:[['💚','Yes'],['🤔','Maybe'],['🙅','No']],h:'Would Recommend'}
].map((q,i)=>({...q,n:i+1}));
const cheers=['Great pick! ✨','Noted! 📝','Smooth flying! 🛫','You’re doing great! 💚','Love it! 🌟','On course! 🧭'];

/* ========= STATE ========= */
const steps=[{t:'welcome'},{t:'consent'}];
parts.forEach(p=>{steps.push({t:'intro',p});Q.filter(q=>q.p===p.id).forEach(q=>steps.push({t:'q',q}))});
steps.push({t:'thanks'});
let S=JSON.parse(localStorage.getItem('mvgfc_bac_survey')||'null')||{i:0,a:{},consent:false,start:Date.now()};
if(S.i>=steps.length-1)S={i:0,a:{},consent:false,start:Date.now()};
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem('mvgfc_bac_survey',JSON.stringify(S));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ========= RENDER ========= */
function progress(){
  const done=steps.slice(0,S.i).filter(s=>s.t==='q').length;
  const pct=Math.round(done/Q.length*100);
  $('fill').style.width=pct+'%';
  $('plane').style.left=pct+'%';
  const cur=steps[S.i];
  $('count').textContent=cur.t==='q'?`Question ${cur.q.n} of ${Q.length}`:cur.t==='thanks'?'Arrived! 🎉':'';
}
function go(d){S.i=Math.max(0,Math.min(steps.length-1,S.i+d));save();render(d)}
function render(d=1){
  const st=$('stage'),s=steps[S.i];
  st.className='stage';void st.offsetWidth;st.classList.add(d<0?'back':'fwd');
  progress();
  if(s.t==='welcome'){
    st.innerHTML=`<div class="center"><div class="big">🌏</div><span class="chip">International Program Feasibility Study</span>
    <h2>Your Journey to Malaysia Starts Here</h2>
    <p class="lead">MVGFC is exploring a partnership with <b>Brickfields Asia College (BAC), Malaysia</b>. Your answers help shape future international programs. It takes about <b>3 minutes</b>. ✈️</p>
    <button class="btn primary" onclick="go(1)">Start my journey 🚀</button></div>`;
  }else if(s.t==='consent'){
    st.innerHTML=`<span class="chip">🔒 Data Privacy Statement & Informed Consent</span>
    <h2>Before we take off…</h2>
    <p class="lead">In compliance with the Data Privacy Act of 2012 (RA 10173):</p>
    <ul class="privacy">
     <li><b>Purpose:</b> Used solely for the feasibility study, institutional planning, and assessment of the proposed international academic program offering.</li>
     <li><b>Confidentiality:</b> Responses are treated with strict confidentiality and presented in aggregate form. No individual respondent will be identified.</li>
     <li><b>Storage & Disposal:</b> Securely maintained by the authorized MVGFC office, retained only as long as necessary, then properly disposed of per institutional policy and data privacy regulations.</li>
     <li><b>Voluntary:</b> Participation is entirely voluntary. You may skip any question or stop at any time without penalty.</li></ul>
    <label class="check"><input type="checkbox" id="cb" ${S.consent?'checked':''}><span>I have read and understood the information above and voluntarily agree to participate in this survey, and consent to the collection and processing of my responses for the purposes stated.</span></label>
    <div class="nav"><button class="btn ghost" onclick="go(-1)">← Back</button><button class="btn primary" id="nx" ${S.consent?'':'disabled'} onclick="go(1)">I agree, continue →</button></div>`;
    $('cb').onchange=e=>{S.consent=e.target.checked;$('nx').disabled=!S.consent;save()};
  }else if(s.t==='intro'){
    st.innerHTML=`<div class="center"><div class="big">${s.p.emoji}</div><span class="chip">Stop ${s.p.id} of 5 · ${s.p.tag}</span>
    <h2>${s.p.title}</h2><p class="lead">${s.p.blurb}</p>
    <div class="nav" style="justify-content:center"><button class="btn ghost" onclick="go(-1)">← Back</button><button class="btn primary" onclick="go(1)">Continue →</button></div></div>`;
  }else if(s.t==='q'){
    const q=s.q,a=S.a[q.n]||{};
    const last=S.i===steps.length-2;
    st.innerHTML=`<span class="chip">${parts[q.p-1].emoji} Part ${q.p} · ${parts[q.p-1].title}</span>
    <h2>${q.n}. ${esc(q.t)}</h2>
    <div class="options" role="radiogroup">${q.o.map((o,k)=>`<button class="opt ${q.o.length%2&&k===q.o.length-1&&q.o.length>3?'wide':''} ${a.k===k?'sel':''}" role="radio" data-k="${k}"><span class="em">${o[0]}</span><span>${esc(o[1])}</span>${k<9?`<kbd>${k+1}</kbd>`:''}</button>`).join('')}</div>
    <div id="specbox"></div><div class="cheer" id="cheer"></div>
    <div class="nav"><button class="btn ghost" onclick="go(-1)">← Back</button><button class="btn primary" id="nx" onclick="next()">${last?'Submit 🛬':'Next →'}</button></div>`;
    st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    showSpec();validate();
  }else if(s.t==='thanks'){
    st.innerHTML=`<div class="center"><div class="big">🎉</div><span class="chip">Welcome to Kuala Lumpur!</span>
    <h2>Thank you for your valuable participation!</h2>
    <p class="lead">Your responses were recorded and will help MVGFC shape its international program offerings. Salamat po! 💚</p>
    <button class="btn gold" onclick="restart()">Submit another response</button></div>`;
    burst();
  }
}
function pick(k){
  const q=steps[S.i].q,o=q.o[k];
  S.a[q.n]={k,label:o[1],spec:S.a[q.n]&&S.a[q.n].k===k?S.a[q.n].spec:''};save();
  document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===k));
  $('cheer').textContent=cheers[Math.floor(Math.random()*cheers.length)];
  showSpec();validate();
  if(!o[2])setTimeout(()=>{if(steps[S.i].q===q)next()},500);
}
function showSpec(){
  const q=steps[S.i].q,a=S.a[q.n],box=$('specbox');
  if(a&&q.o[a.k][2]){
    box.innerHTML=`<input class="spec" id="spec" placeholder="Please specify…" value="${esc(a.spec||'')}">`;
    $('spec').oninput=e=>{a.spec=e.target.value;save();validate()};$('spec').focus();
  }else box.innerHTML='';
}
function validate(){
  const q=steps[S.i].q,a=S.a[q.n];
  const ok=a&&(!q.o[a.k][2]||(a.spec||'').trim());
  $('nx').disabled=!ok;
}
function next(){
  if($('nx').disabled)return;
  if(S.i===steps.length-2)submit();else go(1);
}
document.addEventListener('keydown',e=>{
  const s=steps[S.i];if(s.t!=='q'||e.target.tagName==='INPUT')return;
  if(/^[1-9]$/.test(e.key)&&s.q.o[+e.key-1])pick(+e.key-1);
  if(e.key==='Enter')next();
});

/* ========= SUBMIT ========= */
function payload(){
  const d={timestamp:new Date().toISOString(),consent:'Yes',duration_sec:Math.round((Date.now()-S.start)/1000),device:navigator.userAgent};
  Q.forEach(q=>{const a=S.a[q.n];d['q'+q.n]=a?(a.spec?`${a.label}: ${a.spec.trim()}`:a.label):''});
  return d;
}
async function send(p){
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
}
async function submit(){
  $('nx').disabled=true;$('nx').textContent='Landing… ✈️';
  const p=payload();
  try{await send(p)}catch(e){
    const qd=JSON.parse(localStorage.getItem('mvgfc_bac_queue')||'[]');qd.push(p);localStorage.setItem('mvgfc_bac_queue',JSON.stringify(qd));
  }
  S.i=steps.length-1;S.a={};S.consent=false;localStorage.removeItem('mvgfc_bac_survey');render(1);
}
async function flushQueue(){
  const qd=JSON.parse(localStorage.getItem('mvgfc_bac_queue')||'[]');if(!qd.length)return;
  const left=[];for(const p of qd){try{await send(p)}catch(e){left.push(p)}}
  localStorage.setItem('mvgfc_bac_queue',JSON.stringify(left));
}
window.addEventListener('online',flushQueue);flushQueue();
function restart(){S={i:0,a:{},consent:false,start:Date.now()};save();render(-1)}

/* ========= CONFETTI ========= */
function burst(){
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#2E7D32','#66BB6A','#F9A825','#FFD54F','#1B5E20','#fff'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.random()*6|0],vy:2+Math.random()*4,vx:-2+Math.random()*4,a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<260)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)})();
}
render(1);
